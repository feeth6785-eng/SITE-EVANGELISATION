<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Connexion | WINNER CHAPEL COCOTOMEY
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="login-page">

    <main class="login-container">

        <div class="login-card">


            <!-- ================= LOGO ================= -->

            <div class="login-logo">

                <div class="login-cross">
                    ✝
                </div>

                <h1>
                    WINNER CHAPEL
                </h1>

                <p>
                    COCOTOMEY
                </p>

                <span>
                    CHAPELLE INTERNATIONALE DES VAINQUEURS
                </span>

            </div>


            <!-- ================= TITRE ================= -->

            <div class="login-title">

                <h2>
                    Espace Évangélisation
                </h2>

                <p>
                    Connectez-vous à votre espace personnel.
                </p>

            </div>


            <!-- ================= FORMULAIRE ================= -->

            <form id="loginForm">


                <!-- NOM UTILISATEUR -->

                <div class="form-group">

                    <label for="username">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Votre nom d'utilisateur"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- MESSAGE ERREUR -->

                <div
                    id="loginError"
                    class="login-message"
                    style="display: none;"
                ></div>


                <!-- CONNEXION -->

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    🔐 Se connecter
                </button>

            </form>


            <!-- ================= LIENS ================= -->

            <div class="login-footer">

                <p>
                    Vous n'avez pas encore de compte ?
                </p>

                <a href="register.html">
                    ✚ Créer mon compte
                </a>

                <br>
                <br>

                <a href="index.html">
                    ← Retour à l'accueil
                </a>

            </div>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="java.js"></script>

</body>

</html>
